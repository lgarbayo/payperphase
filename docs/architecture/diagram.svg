<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 640" width="1170" height="640" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">PayPerPhase architecture</title>
  <desc id="d">Claude reads the quote and drives the billing agent. Tested code decides every amount and date and guards every PayPal call. The dentist approves the plan, the notes and any plan edit before it reaches the patient.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
  </defs>
  <rect width="1170" height="640" fill="#f8fafc"/>
  <text x="30" y="36" font-size="22" font-weight="700" fill="#0f172a">PayPerPhase: Claude reads, code decides, the dentist approves</text>

  <g font-size="13" fill="#0f172a">
    <rect x="30" y="56" width="16" height="16" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="54" y="69">Claude reads (never money or dates)</text>
    <rect x="320" y="56" width="16" height="16" rx="4" fill="#dcfce7" stroke="#15803d"/><text x="344" y="69">Tested code decides (cents, dates, amounts)</text>
    <rect x="650" y="56" width="16" height="16" rx="4" fill="#fef3c7" stroke="#b45309"/><text x="674" y="69">Dentist approves</text>
    <rect x="820" y="56" width="16" height="16" rx="4" fill="#ffffff" stroke="#64748b"/><text x="844" y="69">Surface or external service</text>
  </g>

  <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <path d="M220 160 H260"/><path d="M450 160 H490"/><path d="M680 160 H720"/><path d="M910 160 H950"/>
    <path d="M1045 210 V240 H125 V270"/>
    <path d="M220 320 H260"/><path d="M450 320 H490"/><path d="M680 320 H720"/><path d="M910 320 H950"/>
    <path d="M1045 370 V405 H355 V440"/>
    <path d="M220 490 H260"/><path d="M450 490 H490"/><path d="M680 490 H720"/><path d="M910 490 H950"/>
  </g>
  <text x="700" y="399" font-size="12" fill="#475569" text-anchor="middle">domain events (plan approved, plan edited, phase due)</text>

  <g font-size="13" fill="#0f172a">
    <g><rect x="30" y="110" width="190" height="100" rx="12" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
      <text x="125" y="140" text-anchor="middle" font-weight="700">Clinic console</text>
      <text x="125" y="162" text-anchor="middle">uploads a Spanish</text><text x="125" y="180" text-anchor="middle">presupuesto PDF</text></g>
    <g><rect x="260" y="110" width="190" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="355" y="136" text-anchor="middle" font-weight="700">Claude Sonnet 5.5</text>
      <text x="355" y="158" text-anchor="middle">reads lines, teeth and</text><text x="355" y="176" text-anchor="middle">prices as printed text</text><text x="355" y="194" text-anchor="middle">no arithmetic</text></g>
    <g><rect x="490" y="110" width="190" height="100" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
      <text x="585" y="136" text-anchor="middle" font-weight="700">Checks in code</text>
      <text x="585" y="158" text-anchor="middle">euros to cents, re-sum,</text><text x="585" y="176" text-anchor="middle">compare to printed total,</text><text x="585" y="194" text-anchor="middle">validate FDI teeth</text></g>
    <g><rect x="720" y="110" width="190" height="100" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
      <text x="815" y="136" text-anchor="middle" font-weight="700">Phase engine</text>
      <text x="815" y="158" text-anchor="middle">phases, healing windows,</text><text x="815" y="176" text-anchor="middle">dates, cents, Pay in 3 fit</text><text x="815" y="194" text-anchor="middle">(deterministic, tested)</text></g>
    <g><rect x="950" y="110" width="190" height="100" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
      <text x="1045" y="136" text-anchor="middle" font-weight="700">Dentist approves</text>
      <text x="1045" y="158" text-anchor="middle">every phase and every</text><text x="1045" y="176" text-anchor="middle">patient note, then sends</text><text x="1045" y="194" text-anchor="middle">the link and QR code</text></g>

    <g><rect x="30" y="270" width="190" height="100" rx="12" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
      <text x="125" y="296" text-anchor="middle" font-weight="700">Patient page</text>
      <text x="125" y="318" text-anchor="middle">Bryntum Gantt, ledger,</text><text x="125" y="336" text-anchor="middle">exposure meter, closure</text><text x="125" y="354" text-anchor="middle">what-if</text></g>
    <g><rect x="260" y="270" width="190" height="100" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
      <text x="355" y="296" text-anchor="middle" font-weight="700">Drag what-if</text>
      <text x="355" y="318" text-anchor="middle">the engine validates</text><text x="355" y="336" text-anchor="middle">every move, illegal ones</text><text x="355" y="354" text-anchor="middle">snap back</text></g>
    <g><rect x="490" y="270" width="190" height="100" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
      <text x="585" y="296" text-anchor="middle" font-weight="700">Order gate</text>
      <text x="585" y="318" text-anchor="middle">amount read from the</text><text x="585" y="336" text-anchor="middle">store, never the client;</text><text x="585" y="354" text-anchor="middle">only if the phase is due</text></g>
    <g><rect x="720" y="270" width="190" height="100" rx="12" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
      <text x="815" y="296" text-anchor="middle" font-weight="700">PayPal Orders v2</text>
      <text x="815" y="318" text-anchor="middle">one order per phase,</text><text x="815" y="336" text-anchor="middle">official Pay Later</text><text x="815" y="354" text-anchor="middle">message</text></g>
    <g><rect x="950" y="270" width="190" height="100" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
      <text x="1045" y="296" text-anchor="middle" font-weight="700">One transition()</text>
      <text x="1045" y="318" text-anchor="middle">capture, webhook or</text><text x="1045" y="336" text-anchor="middle">return reconcile, then</text><text x="1045" y="354" text-anchor="middle">live update over SSE</text></g>

    <g><rect x="30" y="440" width="190" height="100" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
      <text x="125" y="466" text-anchor="middle" font-weight="700">Dentist approval</text>
      <text x="125" y="488" text-anchor="middle">plan edit: one Approve</text><text x="125" y="506" text-anchor="middle">click on the exact</text><text x="125" y="524" text-anchor="middle">stored payload</text></g>
    <g><rect x="260" y="440" width="190" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="355" y="466" text-anchor="middle" font-weight="700">Billing agent</text>
      <text x="355" y="488" text-anchor="middle">Claude Sonnet 5.5 picks</text><text x="355" y="506" text-anchor="middle">tool calls; code supplies</text><text x="355" y="524" text-anchor="middle">every amount</text></g>
    <g><rect x="490" y="440" width="190" height="100" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
      <text x="585" y="466" text-anchor="middle" font-weight="700">Guard</text>
      <text x="585" y="488" text-anchor="middle">amount, EUR, invoice</text><text x="585" y="506" text-anchor="middle">number, recipient,</text><text x="585" y="524" text-anchor="middle">tool allowlist</text></g>
    <g><rect x="720" y="440" width="190" height="100" rx="12" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
      <text x="815" y="466" text-anchor="middle" font-weight="700">PayPal Agent Toolkit</text>
      <text x="815" y="488" text-anchor="middle">create, send, QR code,</text><text x="815" y="506" text-anchor="middle">remind, record payment</text><text x="815" y="524" text-anchor="middle">(Invoicing v2)</text></g>
    <g><rect x="950" y="440" width="190" height="100" rx="12" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
      <text x="1045" y="466" text-anchor="middle" font-weight="700">Sandbox invoice</text>
      <text x="1045" y="488" text-anchor="middle">one per phase, dated</text><text x="1045" y="506" text-anchor="middle">to the visit, with a</text><text x="1045" y="524" text-anchor="middle">QR code</text></g>
  </g>

  <text x="30" y="590" font-size="14" fill="#0f172a" font-weight="600">Claude never outputs money or dates. Patients only read text a dentist approved.</text>
  <text x="30" y="612" font-size="12" fill="#475569">Sandbox only. Synthetic patients. Medical services need PayPal pre-approval in production.</text>
</svg>
